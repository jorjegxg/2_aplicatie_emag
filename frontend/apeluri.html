<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apeluri review</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <script src="theme.js"></script>
  </head>
  <body>
    <main id="review-login" class="login-shell">
      <form id="review-login-form" class="login-card" method="post" action="/api/review-calls/auth" autocomplete="on">
        <h1 class="login-title">Apeluri review</h1>
        <p class="login-sub">Introdu parola. Browserul o poate reține, ca să nu o mai scrii data viitoare.</p>
        <label class="field login-field">
          <span>Utilizator</span>
          <input id="review-username" name="username" type="text" autocomplete="username" value="apeluri" autocapitalize="none" autocorrect="off" spellcheck="false" required />
        </label>
        <label class="field login-field">
          <span>Parolă</span>
          <input id="review-password" name="password" type="password" required autocomplete="current-password" />
        </label>
        <p id="review-login-error" class="login-error" hidden></p>
        <button type="submit" class="btn login-submit">Intră</button>
      </form>
    </main>
    <div class="page" id="review-page" hidden>
      <div class="top-actions">
        <button type="button" id="btn-review-logout" class="top-action-btn" title="Ieșire" aria-label="Ieșire">↪</button>
        <button type="button" id="btn-theme" class="theme-toggle" aria-pressed="false" title="Comută tema">
          <span class="theme-toggle-label">Light</span>
        </button>
      </div>
      <header class="header">
        <h1>Apeluri review</h1>
        <p class="subtitle">Sună clienții și trimite-le rapid linkul de review eMAG</p>
      </header>

      <section class="toolbar review-toolbar">
        <label class="review-search">
          <span class="visually-hidden">Caută client, telefon, produs sau comandă</span>
          <input id="review-search" type="search" enterkeyhint="search" placeholder="Caută client, telefon, produs sau comandă" />
        </label>
        <button type="button" id="btn-review-filters-size" class="review-filters-size" aria-expanded="true" aria-controls="review-filters">Micșorează filtrele</button>
        <div class="review-filters" id="review-filters" role="group" aria-label="Filtru comenzi">
          <button type="button" class="review-chip is-active" data-filter="all" aria-pressed="true">Fără returnate, BG și HU</button>
          <button type="button" class="review-chip" data-filter="uncalled" aria-pressed="false">Nesunați, fără BG, HU, retur</button>
          <button type="button" class="review-chip" data-filter="reviewed" aria-pressed="false">Cu review</button>
          <button type="button" class="review-chip" data-filter="called" aria-pressed="false">Sunați</button>
          <button type="button" class="review-chip" data-filter="romania" aria-pressed="false">România</button>
          <button type="button" class="review-chip" data-filter="returned" aria-pressed="false">Returnate</button>
          <button type="button" class="review-chip" data-filter="everything" aria-pressed="false">Toate</button>
        </div>
        <div class="review-toolbar-bar">
          <span id="review-summary" class="status" aria-live="polite"></span>
          <button type="button" id="btn-reload" class="btn">Reîncarcă</button>
        </div>
      </section>

      <p id="review-error" class="status is-error" hidden></p>
      <div id="review-list" class="review-list">
        <div class="empty-row">Se încarcă comenzile…</div>
      </div>
    </div>
    <script src="apeluri.js?v=2"></script>
  </body>
</html>
