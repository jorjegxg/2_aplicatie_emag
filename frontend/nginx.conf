map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Exportul trimite tot tabelul intr-un POST (~25mb) si uploadul accepta 20 poze.
    client_max_body_size 50m;

    # Service worker: fără cache agresiv, scope pe tot site-ul.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Paginile se reverifică mereu, ca ?v= nou de la scripturi/CSS să ajungă imediat în browser.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Boții (serviciul boti). Prin variabilă + resolver-ul Docker, ca nginx să pornească și când boti e oprit.
    location /api/boti/ {
        resolver 127.0.0.11 valid=30s;
        set $boti_upstream http://boti:3100;
        proxy_pass $boti_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Raportul / răspunsul botului poate dura câteva minute; SSE pe /api/boti/evenimente.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        client_max_body_size 30m;
    }

    # Claude Code (serviciul emag-cod, rulează pe PC, nu în Docker: cod/server.js, systemd --user).
    # host.docker.internal vine din extra_hosts (/etc/hosts), deci fără resolver; dacă serviciul e oprit, doar 502.
    location /api/cod/ {
        proxy_pass http://host.docker.internal:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Răspunsurile pot dura mult; SSE pe /api/cod/evenimente.
        proxy_read_timeout 3600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        client_max_body_size 30m;
    }

    # API-ul si proxy-ul de poze traiesc in serviciul back.
    location /api/ {
        proxy_pass http://back:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Păstrează proto de la proxy-ul extern; fallback la schema curentă.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Sync-ul eMAG poate rula minute intregi.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /uploads/ {
        proxy_pass http://back:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Poze cu link semnat, de unde le descarca eMAG (vezi /public/product-image din back).
    location /public/ {
        proxy_pass http://back:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
