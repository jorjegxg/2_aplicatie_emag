map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Exportul trimite tot tabelul intr-un POST (~25mb) si uploadul accepta 20 poze.
    client_max_body_size 50m;

    # Service worker: fără cache agresiv, scope pe tot site-ul.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # API-ul si proxy-ul de poze traiesc in serviciul back.
    location /api/ {
        proxy_pass http://back:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Păstrează proto de la proxy-ul extern; fallback la schema curentă.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Sync-ul eMAG poate rula minute intregi.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /uploads/ {
        proxy_pass http://back:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
