<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pregătire Base</title>
    <link rel="stylesheet" href="styles.css?v=20261027-3" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <script src="theme.js"></script>
    <script src="auth.js"></script>
    <script src="logger.js"></script>
  </head>
  <body>
    <div class="page">
      <div class="top-actions">
        <a href="/settings.html" class="top-action-btn" title="Setări" aria-label="Setări">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
          </svg>
        </a>
        <a href="/logs.html" class="top-action-btn" title="Logs" aria-label="Logs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <path d="M14 2v6h6M8 13h8M8 17h5" />
          </svg>
        </a>
        <button
          type="button"
          id="btn-theme"
          class="theme-toggle"
          aria-pressed="false"
          title="Comută tema"
        >
          <svg class="theme-toggle-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="theme-toggle-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
          <span class="theme-toggle-label">Light</span>
        </button>
      </div>
      <header class="header">
        <nav class="site-nav" aria-label="Navigare">
          <a href="/">Produse</a>
          <a href="/base.html" aria-current="page">Pregătire Base</a>
          <a href="/statistici.html">Statistici</a>
          <a href="/apeluri.html">Apeluri review</a>
          <a href="/logs.html">Logs</a>
        </nav>
        <h1>Pregătire Base</h1>
        <p class="subtitle">
          Verifici pozele și textele pe fiecare limbă, profitul și prețurile, apoi trimiți produsul în Base.
          De acolo Base îl pune pe eMAG și Trendyol.
        </p>
      </header>

      <p id="base-status" class="base-status" role="status">Se încarcă starea Base…</p>

      <div class="base-actions base-toolbar">
        <button type="button" id="base-commissions" class="btn btn-secondary" title="Citește din comenzile din Base comisionul real eMAG RO și Trendyol, pentru fiecare produs vândut (doar citire)">
          ↻ Comisioane din Base
        </button>
        <span id="base-commissions-status" class="status" role="status"></span>
      </div>

      <div class="base-layout">
        <aside class="base-list-pane" aria-label="Produse">
          <label class="field field-search">
            <span>Caută produs</span>
            <input type="search" id="base-q" placeholder="cod, nume sau PNK" />
          </label>
          <ul id="base-list" class="base-list"></ul>
        </aside>

        <main id="base-detail" class="base-detail">
          <p class="base-empty">Alege un produs din listă.</p>
        </main>
      </div>
    </div>

    <script src="pricing.js?v=20261005-1"></script>
    <script src="/api/calculator.js?v=20261028-1"></script>
    <script src="base.js?v=20261028-1"></script>
  </body>
</html>
