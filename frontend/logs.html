<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logs</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js"></script>
    <script src="auth.js"></script>
  </head>
  <body>
    <div class="page">
      <div class="top-actions">
        <a href="/settings.html" class="top-action-btn" title="Setări" aria-label="Setări">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
          </svg>
        </a>
        <a href="/logs.html" class="top-action-btn" title="Logs" aria-label="Logs" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <path d="M14 2v6h6M8 13h8M8 17h5" />
          </svg>
        </a>
        <button
          type="button"
          id="btn-theme"
          class="theme-toggle"
          aria-pressed="false"
          title="Comută tema"
        >
          <svg class="theme-toggle-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="theme-toggle-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
          <span class="theme-toggle-label">Light</span>
        </button>
      </div>
      <header class="header">
        <nav class="site-nav" aria-label="Navigare">
          <a href="/">Produse</a>
          <a href="/vanzari.html">Comenzi</a>
          <a href="/sync.html">Sincronizare</a>
          <a href="/logs.html" aria-current="page">Logs</a>
        </nav>
        <h1>Logs</h1>
        <p class="subtitle">Toate acțiunile din aplicație — server, eMAG și browser — pentru debug.</p>
      </header>

      <div class="toolbar">
        <div class="logs-filters">
          <label class="field">
            <span>Nivel</span>
            <select id="filter-level">
              <option value="info,warn,error">Info și mai sus (implicit)</option>
              <option value="debug,info,warn,error">Tot (inclusiv debug)</option>
              <option value="warn,error">Doar avertismente și erori</option>
              <option value="error">Doar erori</option>
            </select>
          </label>
          <label class="field">
            <span>Sursă</span>
            <select id="filter-source">
              <option value="">Toate</option>
            </select>
          </label>
          <label class="field">
            <span>Categorie</span>
            <select id="filter-category">
              <option value="">Toate</option>
            </select>
          </label>
          <label class="field field-search">
            <span>Caută în mesaj și detalii</span>
            <input type="search" id="filter-q" placeholder="ex. 401, offer_id, timeout" />
          </label>
          <label class="field">
            <span>De la</span>
            <input type="datetime-local" id="filter-from" />
          </label>
          <label class="field">
            <span>Până la</span>
            <input type="datetime-local" id="filter-to" />
          </label>
          <button type="button" id="btn-refresh" class="btn btn-secondary">Reîmprospătează</button>
          <label class="logs-auto">
            <input type="checkbox" id="chk-auto" />
            <span>Auto 5s</span>
          </label>
          <button type="button" id="btn-clear" class="btn btn-secondary">Șterge tot</button>
        </div>
      </div>

      <p id="logs-meta" class="logs-meta" role="status">Se încarcă…</p>

      <div class="table-wrap">
        <table class="logs-table">
          <thead>
            <tr>
              <th>Timp</th>
              <th>Nivel</th>
              <th>Sursă</th>
              <th>Categorie</th>
              <th>Mesaj</th>
              <th>Durată</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="logs-body"></tbody>
        </table>
      </div>

      <div class="logs-pager">
        <button type="button" id="btn-prev" class="btn btn-secondary">Anterior</button>
        <span id="pager-info" class="status"></span>
        <button type="button" id="btn-next" class="btn btn-secondary">Următor</button>
      </div>
    </div>

    <script src="pricing.js"></script>
    <script src="logs.js"></script>
  </body>
</html>
