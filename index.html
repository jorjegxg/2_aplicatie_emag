<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Produse eMAG — Editor Excel</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --ink: #1a1d23;
      --muted: #5c6570;
      --line: #d8dde3;
      --accent: #0055a5;
      --accent-hover: #003d7a;
      --danger: #b42318;
      --ok: #067647;
      --focus: #2b6cb0;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.08);
      --font: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    header.app-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: var(--shadow);
    }
    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent);
      white-space: nowrap;
    }
    .brand span { color: var(--muted); font-weight: 500; font-size: .85rem; margin-left: 8px; }
    .tabs { display: flex; gap: 4px; }
    .tab {
      border: 1px solid transparent;
      background: transparent;
      padding: 8px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      font: inherit;
      color: var(--muted);
    }
    .tab.active {
      background: #e8f0fa;
      color: var(--accent);
      border-color: #c5d8ef;
      font-weight: 600;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      padding: 8px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      font: inherit;
      font-size: .9rem;
    }
    .btn:hover { background: #f7f8fa; }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { color: var(--danger); border-color: #f0b4ae; }
    .btn-danger:hover { background: #fef3f2; }
    .btn-sm { padding: 4px 10px; font-size: .8rem; }
    input[type="search"], input[type="text"], input[type="number"], textarea, select {
      font: inherit;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 8px 10px;
      width: 100%;
      background: #fff;
    }
    input:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
    input[readonly] { background: #f4f6f8; color: var(--muted); }
    .search { min-width: 200px; max-width: 280px; }
    main { padding: 16px 20px 40px; max-width: 1600px; margin: 0 auto; }
    .panel { display: none; }
    .panel.active { display: block; }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: .9rem;
    }
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: auto;
      max-height: calc(100vh - 180px);
      box-shadow: var(--shadow);
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: .875rem;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }
    th {
      background: #f7f8fa;
      position: sticky;
      top: 0;
      z-index: 2;
      font-weight: 600;
      color: var(--muted);
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .02em;
    }
    tr:hover td { background: #f9fafb; }
    .col-name { max-width: 280px; white-space: normal; line-height: 1.3; }
    .thumb {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
      background: #eee;
      display: block;
    }
    .thumb-empty {
      width: 40px;
      height: 40px;
      background: #eef0f3;
      border-radius: 4px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: .7rem;
    }
    .settings-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 520px;
      box-shadow: var(--shadow);
    }
    .settings-card h2 { margin: 0 0 8px; font-size: 1.2rem; }
    .settings-card p.hint { margin: 0 0 20px; color: var(--muted); font-size: .9rem; }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .settings-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 24, 30, .45);
      z-index: 100;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 12px;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 12px;
      width: min(920px, 100%);
      box-shadow: 0 20px 50px rgba(0,0,0,.2);
      margin-bottom: 40px;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
    }
    .modal-head h2 { margin: 0; font-size: 1.15rem; }
    .modal-body { padding: 16px 20px 24px; }
    .modal-foot {
      padding: 12px 20px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      position: sticky;
      bottom: 0;
      background: var(--surface);
      border-radius: 0 0 12px 12px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 700px) {
      .grid-2 { grid-template-columns: 1fr; }
      .search { max-width: none; width: 100%; }
    }
    .section-title {
      grid-column: 1 / -1;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--accent);
      font-weight: 700;
      margin: 12px 0 4px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }
    .section-title:first-child { border-top: none; margin-top: 0; padding-top: 0; }
    .full { grid-column: 1 / -1; }
    textarea { min-height: 80px; resize: vertical; }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--ink);
      color: #fff;
      padding: 12px 18px;
      border-radius: var(--radius);
      z-index: 200;
      opacity: 0;
      transform: translateY(8px);
      transition: .2s;
      pointer-events: none;
      font-size: .9rem;
    }
    .toast.show { opacity: 1; transform: none; }
    .toast.ok { background: var(--ok); }
    .toast.err { background: var(--danger); }
    .empty { text-align: center; padding: 40px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="app-bar">
    <div class="brand">Produse eMAG <span id="countLabel"></span></div>
    <nav class="tabs">
      <button type="button" class="tab active" data-tab="produse">Produse</button>
      <button type="button" class="tab" data-tab="setari">Setări</button>
    </nav>
    <div class="actions">
      <input type="search" class="search" id="search" placeholder="Caută cod, nume, brand…" />
      <button type="button" class="btn btn-primary" id="btnAdd">+ Adaugă</button>
      <button type="button" class="btn" id="btnImport">Import Excel</button>
      <input type="file" id="fileImport" accept=".xlsx,.xls" hidden />
      <button type="button" class="btn btn-primary" id="btnExport">Export Excel</button>
    </div>
  </header>

  <main>
    <section id="panel-produse" class="panel active">
      <div class="meta-row">
        <span id="filterInfo"></span>
        <button type="button" class="btn btn-sm" id="btnResetData">Resetează la Excel original</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>No.</th>
              <th>COD</th>
              <th>Nume produs</th>
              <th>Categorie</th>
              <th>Brand</th>
              <th>USD</th>
              <th>Vânzare RON</th>
              <th>Stoc</th>
              <th>Poza</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="emptyMsg" hidden>Niciun produs găsit.</div>
      </div>
    </section>

    <section id="panel-setari" class="panel">
      <div class="settings-card">
        <h2>Setări prețuri</h2>
        <p class="hint">Schimbă factorii, apoi aplică — recalculează toate produsele.</p>
        <div class="field">
          <label for="setUsd">Curs USD → RON</label>
          <input type="number" id="setUsd" step="0.01" min="0" />
        </div>
        <div class="field">
          <label for="setMult">Multiplicator</label>
          <input type="number" id="setMult" step="0.01" min="0" />
        </div>
        <div class="field">
          <label for="setPrp">Factor PRP (× Preț vânzare)</label>
          <input type="number" id="setPrp" step="0.01" min="0" />
        </div>
        <div class="field">
          <label for="setPragMin">Factor Prag Minim (× Preț vânzare)</label>
          <input type="number" id="setPragMin" step="0.01" min="0" />
        </div>
        <div class="field">
          <label for="setPragMax">Factor Prag Maxim (× Preț vânzare)</label>
          <input type="number" id="setPragMax" step="0.01" min="0" />
        </div>
        <div class="settings-actions">
          <button type="button" class="btn btn-primary" id="btnApplySettings">Aplică / recalculează</button>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">Editează produs</h2>
        <button type="button" class="btn btn-sm" id="btnCloseModal">Închide</button>
      </div>
      <div class="modal-body">
        <form id="productForm" class="grid-2">
          <div class="section-title">Identificare</div>
          <div class="field"><label>No.</label><input name="no" type="text" /></div>
          <div class="field"><label>Item No.</label><input name="itemNo" type="text" /></div>
          <div class="field"><label>ID Produs</label><input name="idProdus" type="text" /></div>
          <div class="field"><label>COD PRODUS</label><input name="codProdus" type="text" required /></div>
          <div class="field"><label>EAN</label><input name="ean" type="text" /></div>
          <div class="field"><label>Brand</label><input name="brand" type="text" /></div>
          <div class="field"><label>Categorie</label><input name="categorie" type="text" /></div>
          <div class="field"><label>Limba sursă</label><input name="limbaSursa" type="text" /></div>
          <div class="field"><label>PNK</label><input name="pnk" type="text" /></div>

          <div class="section-title">Texte</div>
          <div class="field full"><label>Nume produs</label><input name="numeProdus" type="text" /></div>
          <div class="field full"><label>Description</label><textarea name="description"></textarea></div>
          <div class="field full"><label>Descriere RO</label><textarea name="descriereRo" rows="5"></textarea></div>
          <div class="field full"><label>Locație poze</label><input name="locatiePoze" type="text" /></div>

          <div class="section-title">Prețuri</div>
          <div class="field"><label>Unit Price (USD)</label><input name="unitPriceUsd" type="number" step="0.01" min="0" /></div>
          <div class="field"><label>Profit</label><input name="profit" type="text" /></div>
          <div class="field"><label>Preț unitar (RON)</label><input name="pretUnitarRon" type="number" step="0.01" readonly /></div>
          <div class="field"><label>Preț vânzare (RON)</label><input name="pretVanzareRon" type="number" step="0.01" readonly /></div>
          <div class="field"><label>PRP</label><input name="prp" type="number" step="0.01" readonly /></div>
          <div class="field"><label>TVA</label><input name="tva" type="text" value="21%" /></div>
          <div class="field"><label>Prag Minim</label><input name="pragMinim" type="number" step="0.01" readonly /></div>
          <div class="field"><label>Prag Maxim</label><input name="pragMaxim" type="number" step="0.01" readonly /></div>

          <div class="section-title">Stoc & livrare</div>
          <div class="field"><label>Stoc</label><input name="stoc" type="number" step="1" /></div>
          <div class="field"><label>Zile predare curier</label><input name="zileCurier" type="number" step="1" /></div>
          <div class="field"><label>Zile reaprovizionare</label><input name="zileReaprovizionare" type="number" step="1" /></div>

          <div class="section-title">Familie</div>
          <div class="field"><label>Nume familie</label><input name="numeFamilie" type="text" /></div>
          <div class="field"><label>ID familie</label><input name="idFamilie" type="text" /></div>
          <div class="field"><label>Tip familie</label><input name="tipFamilie" type="text" /></div>

          <div class="section-title">Poze (URL)</div>
          <div class="field"><label>Poza 1</label><input name="poza1" type="text" /></div>
          <div class="field"><label>Poza 2</label><input name="poza2" type="text" /></div>
          <div class="field"><label>Poza 3</label><input name="poza3" type="text" /></div>
          <div class="field"><label>Poza 4</label><input name="poza4" type="text" /></div>
          <div class="field"><label>Poza 5</label><input name="poza5" type="text" /></div>
          <div class="field"><label>Poza 6</label><input name="poza6" type="text" /></div>
          <div class="field"><label>Poza 7</label><input name="poza7" type="text" /></div>
        </form>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn" id="btnCancelModal">Anulează</button>
        <button type="button" class="btn btn-primary" id="btnSaveProduct">Salvează</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

      const form = document.getElementById("productForm");
      if (!form.reportValidity()) return;
      const p = readForm();
      if (editIndex === null) products.push(p);
      else products[editIndex] = p;
      saveState();
      renderTable();
      closeModal();
      toast("Salvat", "ok");
    });

    document.getElementById("btnApplySettings").addEventListener("click", () => {
      readSettingsForm();
      recalcAll();
      saveState();
      renderTable();
      toast("Setări aplicate — prețuri recalculate", "ok");
    });

    document.getElementById("btnResetData").addEventListener("click", () => {
      if (!confirm("Resetezi toate modificările la datele din Excel original?")) return;
      localStorage.removeItem(STORAGE_KEY);
      settings = { ...EMBEDDED.settings };
      products = structuredClone(EMBEDDED.products);
      fillSettingsForm();
      renderTable();
      toast("Resetat la Excel original", "ok");
    });

    document.getElementById("btnExport").addEventListener("click", exportExcel);
    document.getElementById("btnImport").addEventListener("click", () => {
      document.getElementById("fileImport").click();
    });
    document.getElementById("fileImport").addEventListener("change", (e) => {
      const f = e.target.files?.[0];
      if (f) importExcel(f);
      e.target.value = "";
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    /* init */
    const fromStore = loadState();
    if (!fromStore) recalcAll();
    fillSettingsForm();
    renderTable();
    if (fromStore) toast("Date restaurate din browser", "ok");
  </script>
</body>
</html>
