<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eMAG — Comenzi</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <nav class="site-nav" aria-label="Navigare">
          <a href="/">Produse</a>
          <a href="/vanzari.html" aria-current="page">Comenzi</a>
        </nav>
        <h1>eMAG Marketplace</h1>
        <p class="subtitle">Comenzi vândute — preț și profit (doar citire)</p>
      </header>

      <div class="toolbar">
        <div class="toolbar-fields">
          <div class="field field-readonly-info">
            <span>Procentaj pret transport (%)</span>
            <p class="field-value-line">
              <span id="procentaj-alte-costuri-display">—</span>
              <a href="/" class="field-edit-link">Editează pe Produse</a>
            </p>
            <input type="hidden" id="procentaj-alte-costuri" name="procentaj-alte-costuri" value="" />
          </div>
          <div class="field field-readonly-info">
            <span>Procentaj pret contabil (%)</span>
            <p class="field-value-line">
              <span id="procentaj-pret-contabil-display">—</span>
              <a href="/" class="field-edit-link">Editează pe Produse</a>
            </p>
            <input type="hidden" id="procentaj-pret-contabil" name="procentaj-pret-contabil" value="" />
          </div>
          <label class="field">
            <span>De la <span class="field-hint">(max 31 zile)</span></span>
            <input type="datetime-local" id="created-after" name="created-after" />
          </label>
          <label class="field">
            <span>Până la</span>
            <input type="datetime-local" id="created-before" name="created-before" />
          </label>
          <label class="field">
            <span>Status</span>
            <select id="order-status" name="order-status">
              <option value="">Toate</option>
              <option value="1">Nou</option>
              <option value="2">În progres</option>
              <option value="3">Preparat</option>
              <option value="4">Finalizat</option>
              <option value="0">Anulat</option>
              <option value="5">Returnat</option>
            </select>
          </label>
          <label class="field">
            <span id="total-profit-label">Total profit încărcat</span>
            <input type="text" id="total-profit-page" readonly tabindex="-1" value="—" />
          </label>
        </div>
        <div class="toolbar-actions">
          <button type="button" id="btn-load" class="btn btn-with-icon">
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6a6 6 0 0 1-9.33 4.96l-1.44 1.44A8 8 0 0 0 20 13c0-4.42-3.58-8-8-8zm-6 2.04A8 8 0 0 0 4 13c0 4.42 3.58 8 8 8v4l5-5-5-5v4a6 6 0 0 1-6-6c0-1.58.61-3.02 1.61-4.1L6 7.04z"
              />
            </svg>
            Reload comenzi
          </button>
          <button type="button" id="btn-more" class="btn btn-secondary" hidden>
            Pagina următoare
          </button>
          <span id="status" class="status" aria-live="polite"></span>
        </div>
      </div>

      <div class="table-wrap">
        <table id="orders-table" class="orders-table">
          <thead>
            <tr>
              <th class="col-expand"></th>
              <th>ID comandă</th>
              <th>Dată</th>
              <th>Status</th>
              <th>Client</th>
              <th>Plată</th>
              <th>Linii</th>
              <th>Profit comandă</th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <tr class="empty-row">
              <td colspan="8">Apasă „Reload comenzi” pentru a afișa vânzările.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <script src="vanzari.js"></script>
  </body>
</html>
