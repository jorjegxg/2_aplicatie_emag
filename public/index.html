<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eMAG — Produse</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <h1>eMAG Marketplace</h1>
        <p class="subtitle">Ofertele tale — caracteristici principale</p>
      </header>

      <div class="toolbar">
        <button type="button" id="btn-load" class="btn">Încarcă produse</button>
        <button type="button" id="btn-more" class="btn btn-secondary" hidden>
          Pagina următoare
        </button>
        <span id="status" class="status" aria-live="polite"></span>
      </div>

      <div class="table-wrap">
        <table id="products-table">
          <thead>
            <tr>
              <th>#</th>
              <th>ID</th>
              <th>Nume</th>
              <th>Part number</th>
              <th>Pret emag</th>
              <th>Preț cumpărare</th>
              <th>Stoc</th>
              <th>Status</th>
              <th>EAN / PNK</th>
            </tr>
          </thead>
          <tbody id="products-body">
            <tr class="empty-row">
              <td colspan="9">Apasă „Încarcă produse” pentru a afișa ofertele.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
