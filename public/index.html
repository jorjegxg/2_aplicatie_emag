<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produse</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js"></script>
    <script src="logger.js"></script>
  </head>
  <body>
    <div class="page">
      <div class="top-actions">
        <a href="/logs.html" class="top-action-btn" title="Logs" aria-label="Logs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <path d="M14 2v6h6M8 13h8M8 17h5" />
          </svg>
        </a>
        <button
        type="button"
        id="btn-theme"
        class="theme-toggle"
        aria-pressed="false"
        title="Comută tema"
      >
        <svg class="theme-toggle-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg class="theme-toggle-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <span class="theme-toggle-label">Light</span>
        </button>
      </div>
      <header class="header">
        <nav class="site-nav" aria-label="Navigare">
          <a href="/" aria-current="page">Produse</a>
          <a href="/vanzari.html">Comenzi</a>
          <a href="/sync.html">Sincronizare</a>
          <a href="/logs.html">Logs</a>
        </nav>
      </header>

      <div class="toolbar">
        <div class="toolbar-fields">
          <label class="field">
            <span>Procentaj pentru Pret transport (%)</span>
            <input
              type="number"
              id="procentaj-alte-costuri"
              name="procentaj-alte-costuri"
              min="0"
              step="0.01"
              placeholder="0"
            />
          </label>
          <label class="field">
            <span>Multiplicator preț recomandat (PRP)</span>
            <input
              type="number"
              id="mult-prp"
              name="mult-prp"
              min="0"
              step="0.01"
              placeholder="1.15"
            />
          </label>
          <label class="field">
            <span>Multiplicator preț minim</span>
            <input
              type="number"
              id="mult-min"
              name="mult-min"
              min="0"
              step="0.01"
              placeholder="0.85"
            />
          </label>
          <label class="field">
            <span>Multiplicator preț maxim</span>
            <input
              type="number"
              id="mult-max"
              name="mult-max"
              min="0"
              step="0.01"
              placeholder="1.30"
            />
          </label>
          <label class="field">
            <span>Total preț transport × stoc</span>
            <input type="text" id="total-alte-stoc" readonly tabindex="-1" value="—" />
          </label>
          <button type="button" id="btn-save-settings" class="btn btn-secondary" disabled>
            Salvează
          </button>
        </div>
        <div class="toolbar-actions">
          <button type="button" id="btn-more" class="btn btn-secondary" hidden>
            Pagina următoare
          </button>
          <div class="col-menu-wrap">
            <button type="button" id="btn-columns" class="btn btn-secondary btn-with-icon" aria-expanded="false" aria-controls="col-menu">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  fill="currentColor"
                  d="M3 5h18v2.17l-6.41 6.41V21l-3.18-1.59V13.58L3 7.17V5zm2.41 2 5.59 5.59V18.5l1 .5v-6.41L17.59 7H5.41z"
                />
              </svg>
              Coloane
            </button>
            <div id="col-menu" class="col-menu" hidden role="menu"></div>
          </div>
          <button
            type="button"
            id="btn-table-fullscreen"
            class="btn btn-secondary btn-with-icon"
            aria-pressed="false"
            title="Tabel pe toată pagina"
          >
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"
              />
            </svg>
            <span class="btn-fullscreen-label">Toată pagina</span>
          </button>
          <div class="col-menu-wrap export-wrap">
            <button type="button" id="btn-export" class="btn btn-secondary btn-with-icon" title="Exportă ce se vede în tabel">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  fill="currentColor"
                  d="M5 20h14v-2H5v2zm7-16v9.17l3.59-3.58L17 11l-5 5-5-5 1.41-1.41L12 13.17V4h0z"
                />
              </svg>
              Export Excel
            </button>
            <button
              type="button"
              id="btn-export-menu"
              class="btn btn-secondary btn-caret"
              aria-expanded="false"
              aria-controls="export-menu"
              aria-label="Opțiuni export"
              title="Opțiuni export"
            >
              ▾
            </button>
            <div id="export-menu" class="col-menu export-menu" hidden role="menu">
              <button type="button" class="export-menu-item" data-export-mode="visible" role="menuitem">
                Ce se vede în tabel
              </button>
              <button type="button" class="export-menu-item" data-export-mode="all" role="menuitem">
                Toate produsele încărcate
              </button>
            </div>
          </div>
          <span id="status" class="status" aria-live="polite"></span>
        </div>
      </div>

      <div class="table-wrap">
        <table id="products-table">
          <thead>
            <tr>
              <th data-col="index" data-src="calc">#</th>
              <th data-col="id" data-src="channel">ID</th>
              <th data-col="name" data-src="channel">Nume</th>
              <th data-col="description" data-src="channel">Descriere</th>
              <th data-col="part_number" data-src="channel">Part number</th>
              <th data-col="id_familie" data-src="channel">ID familie</th>
              <th data-col="familie" data-src="channel">Familie</th>
              <th data-col="pret_cumparare" data-src="db">Preț cumpărare</th>
              <th data-col="alte_costuri" data-src="calc">Pret transport</th>
              <th data-col="pret_emag" data-src="db" class="col-pret-emag">Preț vânzare</th>
              <th data-col="prp" data-src="channel">PRP</th>
              <th data-col="pret_minim" data-src="channel">Pret minim</th>
              <th data-col="pret_maxim" data-src="channel">Pret maxim</th>
              <th data-col="stoc" data-src="channel">Stoc</th>
              <th data-col="ean" data-src="channel">EAN</th>
              <th data-col="pnk" data-src="channel">PNK</th>
            </tr>
            <tr class="filter-row">
              <th data-col="index"></th>
              <th data-col="id"><input type="search" class="col-filter" data-filter-col="id" placeholder="Filtrează…" aria-label="Filtrează ID" /></th>
              <th data-col="name"><input type="search" class="col-filter" data-filter-col="name" placeholder="Filtrează…" aria-label="Filtrează Nume" /></th>
              <th data-col="description"><input type="search" class="col-filter" data-filter-col="description" placeholder="Filtrează…" aria-label="Filtrează Descriere" /></th>
              <th data-col="part_number"><input type="search" class="col-filter" data-filter-col="part_number" placeholder="Filtrează…" aria-label="Filtrează Part number" /></th>
              <th data-col="id_familie"><input type="search" class="col-filter" data-filter-col="id_familie" placeholder="Filtrează…" aria-label="Filtrează ID familie" /></th>
              <th data-col="familie"><input type="search" class="col-filter" data-filter-col="familie" placeholder="Filtrează…" aria-label="Filtrează Familie" /></th>
              <th data-col="pret_cumparare"><input type="search" class="col-filter" data-filter-col="pret_cumparare" placeholder="Filtrează…" aria-label="Filtrează Preț cumpărare" /></th>
              <th data-col="alte_costuri"><input type="search" class="col-filter" data-filter-col="alte_costuri" placeholder="Filtrează…" aria-label="Filtrează Pret transport" /></th>
              <th data-col="pret_emag"><input type="search" class="col-filter" data-filter-col="pret_emag" placeholder="Filtrează…" aria-label="Filtrează Preț vânzare" /></th>
              <th data-col="prp"><input type="search" class="col-filter" data-filter-col="prp" placeholder="Filtrează…" aria-label="Filtrează PRP" /></th>
              <th data-col="pret_minim"><input type="search" class="col-filter" data-filter-col="pret_minim" placeholder="Filtrează…" aria-label="Filtrează Pret minim" /></th>
              <th data-col="pret_maxim"><input type="search" class="col-filter" data-filter-col="pret_maxim" placeholder="Filtrează…" aria-label="Filtrează Pret maxim" /></th>
              <th data-col="stoc"><input type="search" class="col-filter" data-filter-col="stoc" placeholder="Filtrează…" aria-label="Filtrează Stoc" /></th>
              <th data-col="ean"><input type="search" class="col-filter" data-filter-col="ean" placeholder="Filtrează…" aria-label="Filtrează EAN" /></th>
              <th data-col="pnk"><input type="search" class="col-filter" data-filter-col="pnk" placeholder="Filtrează…" aria-label="Filtrează PNK" /></th>
            </tr>
          </thead>
          <tbody id="products-body">
            <tr class="empty-row">
              <td colspan="16">Se încarcă din baza de date…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <script src="pricing.js"></script>
    <script src="table-columns.js"></script>
    <script src="app.js"></script>
  </body>
</html>
