services:
  db:
    image: postgres:16
    container_name: emag-db
    restart: unless-stopped
    ports:
      # 5433 pe host: evita conflict cu Postgres local pe 5432
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emag}
      POSTGRES_DB: ${POSTGRES_DB:-emag}
    volumes:
      - emag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emag} -d ${POSTGRES_DB:-emag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Pozele stau in Cloudflare R2; MinIO local ramane doar backup si porneste
  # numai la cerere: docker compose --profile minio up -d minio
  minio:
    image: minio/minio:latest
    container_name: emag-minio
    restart: unless-stopped
    profiles: ["minio"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      # MINIO_* separat de S3_*, ca aplicatia sa poata folosi R2 fara sa schimbe MinIO.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-${S3_ACCESS_KEY:-minioadmin}}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-${S3_SECRET_KEY:-minioadmin}}
    volumes:
      - emag_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${S3_ACCESS_KEY:-minioadmin}}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:-${S3_SECRET_KEY:-minioadmin}}
      S3_BUCKET: ${MINIO_BUCKET:-${S3_BUCKET:-emag-products}}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb -p local/$$S3_BUCKET || true &&
      mc anonymous set download local/$$S3_BUCKET &&
      exit 0
      "

  back:
    build: ./backend
    container_name: emag-back
    restart: unless-stopped
    env_file:
      - .env
    # `environment` bate `env_file`: in .env host-ul foloseste 127.0.0.1, in retea
    # Docker serviciile se cheama db / minio.
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-emag}:${POSTGRES_PASSWORD:-emag}@db:5432/${POSTGRES_DB:-emag}
      # S3_ENDPOINT_DOCKER din .env (ex. Cloudflare R2) inlocuieste MinIO-ul local.
      # Fara el, porneste si MinIO: docker compose --profile minio up -d
      S3_ENDPOINT: ${S3_ENDPOINT_DOCKER:-http://minio:9000}
    volumes:
      # Păstrează cheile VAPID între recreări/restarturi ale containerului.
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Urmareste validarile eMAG si anunta cand poti pune produsul pe platforma
  # urmatoare: RO -> HU -> BG. Pagina Validari + Telegram (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID).
  # Cu VALIDARI_SEND=1 retrimite singur din Base pe tara refuzata cat era alta in validare.
  # Log: docker logs emag-validari
  validari:
    build: ./backend
    container_name: emag-validari
    restart: unless-stopped
    command: ["node", "validari-worker.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-emag}:${POSTGRES_PASSWORD:-emag}@db:5432/${POSTGRES_DB:-emag}
      VALIDARI_INTERVAL_SEC: ${VALIDARI_INTERVAL_SEC:-300}
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy

  # Boții care citesc din Base / eMAG / Trendyol și îți vorbesc (pagina Boți). Doar citesc, nu trimit nimic.
  # Creierul: Claude prin abonament (CLAUDE_CODE_OAUTH_TOKEN din `claude setup-token`) sau ANTHROPIC_API_KEY;
  # tokenul se poate schimba și din pagina Boți. Log: docker logs emag-boti
  boti:
    build:
      context: ./backend
      dockerfile: Dockerfile.boti
    container_name: emag-boti
    restart: unless-stopped
    command: ["node", "boti-server.js"]
    env_file:
      - .env
    environment:
      PORT: 3100
      DATABASE_URL: postgres://${POSTGRES_USER:-emag}:${POSTGRES_PASSWORD:-emag}@db:5432/${POSTGRES_DB:-emag}
      S3_ENDPOINT: ${S3_ENDPOINT_DOCKER:-http://minio:9000}
      VOCE_URL: http://voce:8000
      # Chrome-ul boților de pe PC (scripts/bot-chrome/: systemd + releu pe docker0).
      BOT_CHROME_CDP: ${BOT_CHROME_CDP:-http://172.17.0.1:9224}
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy

  # Vocea boților: text-to-speech în română (Piper / Supertonic / Edge) și transcriere (faster-whisper), pe CPU.
  # Modelele se descarcă o singură dată în volumul emag_voce_models.
  voce:
    build: ./voce
    container_name: emag-voce
    restart: unless-stopped
    environment:
      VOCE_STT_MODEL: ${VOCE_STT_MODEL:-large-v3-turbo}
      VOCE_STT_THREADS: ${VOCE_STT_THREADS:-6}
    # Pe 127.0.0.1:8100 pentru hook-ul de voce al Claude Code de pe PC (~/.claude/hooks/vorbeste.js).
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - emag_voce_models:/models

  front:
    build: ./frontend
    container_name: emag-front
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - back

volumes:
  emag_pgdata:
  emag_minio_data:
  emag_voce_models:
